<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMR Route Guide</title>
<meta name="description" content="GPS guide for the Sensus AMR water meter read route, WSU Pullman.">
<meta name="theme-color" content="#981e32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
:root{--primary:#981e32;--primary-dark:#7a1828;--accent:#c69214;--bg:#f5f5f5;--card:#fff;--text:#2d2d2d;
--muted:#6b7280;--border:#e5e7eb;--green:#059669;--blue:#2563eb;--warn-bg:#fff3cd;--warn-text:#7a5b00;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
 font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
#map{position:absolute;inset:0;background:#efe9e2}
.leaflet-container{background:#efe9e2}
/* maneuver banner */
#banner{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;max-width:560px;z-index:900;
 background:var(--primary);color:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;
 gap:12px;padding:10px 14px;min-height:76px}
#banner.walk{background:var(--blue)}
#banner.off{background:#b45309}
#banner.idle{background:#374151}
#bArrow{flex:0 0 56px;height:56px}
#bArrow svg{width:56px;height:56px}
#bText{flex:1;min-width:0}
#bDist{font-size:28px;font-weight:800;line-height:1.05}
#bInstr{font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
#bThen{font-size:13px;opacity:.9;margin-top:2px}
/* stop card */
#card{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:560px;z-index:900;
 background:var(--card);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);overflow:hidden}
#cardHead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.stopno{background:var(--primary);color:#fff;font-weight:800;border-radius:16px;min-width:34px;height:34px;padding:0 8px;
 display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.stopno.walk{background:var(--blue)}
.stopno.depot{background:#374151}
#cTitle{flex:1;min-width:0}
#cSite{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cSub{font-size:13px;color:var(--muted)}
#cToggle{background:none;border:none;font-size:20px;color:var(--muted);padding:4px 8px}
#meters{max-height:32vh;overflow:auto;padding:4px 12px;display:none}
#card.open #meters{display:block}
.m{padding:6px 0;border-bottom:1px solid #f0edea;font-size:14px}
.m:last-child{border-bottom:none}
.m .mn{font-family:Consolas,Menlo,monospace;font-weight:700}
.m .mw{color:var(--muted)}
.m.attn{background:var(--warn-bg);margin:0 -12px;padding:6px 12px}
.m .note{color:var(--warn-text);font-size:13px}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px}
#prompt{display:none;padding:10px 12px;background:#faf7f4;border-top:1px solid var(--border);font-size:15px}
#prompt.show{display:block}
#prompt b{display:block;margin-bottom:6px}
#actions{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:48px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);
 font-weight:700;font-size:15px;padding:8px 12px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--primary);border-color:var(--primary)}
.btn:disabled{opacity:.45}
/* side controls */
#side{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:900;display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);
 display:flex;align-items:center;justify-content:center;color:var(--text)}
.fab svg{width:26px;height:26px}
.fab.on{color:var(--primary)}
.fab.off{color:#9ca3af}
#gps{background:#fff;border-radius:14px;padding:4px 6px;font-size:11.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);
 text-align:center;width:52px;line-height:1.15}
.leaflet-bottom{bottom:var(--ctlBottom,0px)}
#gps.good{color:var(--green)} #gps.weak{color:#b45309} #gps.none{color:#dc2626}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:40%;z-index:1200;background:rgba(17,24,39,.92);color:#fff;
 padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;text-align:center;display:none}
/* list panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:1100;background:var(--card);
 box-shadow:-4px 0 18px rgba(0,0,0,.25);display:none;flex-direction:column}
#panel.show{display:flex}
#pHead{background:var(--primary);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#pHead h2{margin:0;font-size:18px;flex:1}
#pHead button{background:none;border:none;color:#fff;font-size:26px;line-height:1}
#pBody{overflow:auto;flex:1;padding:8px 12px 24px}
.sum{font-size:14px;color:var(--muted);margin:6px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #f0edea;border-radius:8px}
.row.cur{background:#fdf2f4}
.row .stopno{min-width:30px;height:30px;font-size:14px}
.row .rs{flex:1;min-width:0}
.row .rs div:first-child{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs div:last-child{font-size:12.5px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap}
.chip.done{background:#d1fae5;color:#065f46} .chip.skip{background:#e5e7eb;color:#374151} .chip.attn{background:var(--accent);color:#fff}
.chip.pass{background:#fef3c7;color:#92400e}
.row button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;color:var(--primary)}
.sec{font-weight:800;color:var(--primary);margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.help p{margin:6px 0;font-size:14px}
.help li{font-size:14px;margin:4px 0}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* start screen */
#start{position:absolute;inset:0;z-index:1300;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#startCard{background:#fff;border-radius:14px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#startCard header{background:var(--primary);color:#fff;padding:16px 18px}
#startCard header h1{margin:0;font-size:22px}
#startCard header p{margin:4px 0 0;font-size:13.5px;opacity:.92}
#startCard .body{padding:14px 18px}
#startCard .body p{margin:6px 0;font-size:14.5px}
#startCard .body p.newroute{background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:8px 10px;font-weight:600}
#startCard .btns{display:flex;flex-direction:column;gap:10px;padding:0 18px 18px}
/* sim */
#sim{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));z-index:950;background:#111827;color:#fff;
 border-radius:10px;padding:6px 10px;display:none;gap:8px;align-items:center;font-size:13px}
#sim.show{display:flex}
#sim button{background:#374151;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-weight:700}
/* markers */
.sm{background:var(--primary);color:#fff;border:2px solid #fff;border-radius:14px;font-weight:800;font-size:12px;
 min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0 4px}
.sm.done{background:var(--green)} .sm.skip{background:#9ca3af} .sm.cur{background:var(--accent);transform:scale(1.25)}
.sm.attn{border-color:var(--accent)}
.sm.depot{background:#374151}
.me{width:30px;height:30px}
@media (min-width:900px) and (orientation:landscape){
 #banner{right:auto;width:520px}
 #card{right:auto;width:520px}
}
@media (max-width:420px){
 #bDist{font-size:24px} #bInstr{font-size:17px} #bArrow,#bArrow svg{width:46px;height:46px;flex-basis:46px}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Route map"></div>

<div id="banner" class="idle" aria-live="polite">
 <div id="bArrow"></div>
 <div id="bText"><div id="bDist">&nbsp;</div><div id="bInstr">Loading the route</div><div id="bThen"></div></div>
</div>
<div id="side">
 <div id="gps" class="none">GPS off</div>
 <button class="fab on" id="fFollow" title="Follow my position" aria-label="Follow my position"></button>
 <button class="fab on" id="fVoice" title="Voice on or off" aria-label="Voice on or off"></button>
 <button class="fab" id="fLayer" title="Map style" aria-label="Map style"></button>
 <button class="fab" id="fList" title="Stop list" aria-label="Stop list"></button>
</div>

<div id="card">
 <div id="cardHead">
  <span class="stopno" id="cNo">1</span>
  <div id="cTitle"><div id="cSite">&nbsp;</div><div id="cSub">&nbsp;</div></div>
  <button id="cToggle" aria-label="Show meters">&#9650;</button>
 </div>
 <div id="meters"></div>
 <div id="prompt"></div>
 <div id="actions">
  <button class="btn primary" id="aNext">Next</button>
  <button class="btn" id="aSkip">Skip stop</button>
  <button class="btn ghost" id="aGmaps">Google Maps</button>
 </div>
</div>

<div id="sim"><span>Simulate</span><button id="sPlay">Play</button><button id="sSpeed">5x</button></div>
<div id="toast" role="status"></div>

<aside id="panel" aria-label="Stop list">
 <div id="pHead"><h2>Stops</h2><button id="pClose" aria-label="Close">&times;</button></div>
 <div id="pBody"></div>
</aside>

<div id="start">
 <div id="startCard">
  <header><h1>AMR Route Guide</h1><p>Sensus AMR water meter read route, WSU Pullman</p></header>
  <div class="body" id="startBody"><p>Loading the route&hellip;</p></div>
  <div class="btns" id="startBtns"></div>
 </div>
</div>

<script>
'use strict';
const APP_VERSION = '2026.09.30-2';
const CFG = {
  arrive: {drive: 45, walk: 15},     // m: arrival radius at the end of a leg
  off: {drive: 45, walk: 25},        // m: off-route distance
  offFixes: 3,                       // consecutive fixes before "off route"
  far: {drive: 250, walk: 40},       // m: first voice prompt before a maneuver
  near: {drive: 45, walk: 10},       // m: second voice prompt
  maxAcc: 60,                        // m: a fix worse than this only moves the marker; it is not matched to the route
  leaveSpeed: 3,                     // m/s: faster than this, away from a waiting stop, the drive goes on without a tap
  leaveDist: 80,                     // m: and farther than this from the end of the leg
  fixStaleMs: 10000,                 // ms: no new fix for this long shows GPS lost
  headingHoldMs: 30000,              // ms: the off-route arrow keeps the last known heading this long
  lookAhead: 100,                    // m: matching first looks this far ahead of the last position on the leg
  speedBaseMs: 10000,                // ms: a speed worked out from two fixes is measured over at least this long (a GPS step of 5 to 15 m must not read as driving)
  leaveFixes: 2,                     // consecutive fixes that must show the vehicle driving away before the guide goes on
  rerouteGapMs: 20000,
  rerouteTimeoutMs: 8000,            // ms: give up on a reroute request after this long
  zoom: {drive: 17, walk: 18},
  osrm: {drive: 'https://routing.openstreetmap.de/routed-car/route/v1/driving/',
         walk: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'},
  simSpeed: {drive: 11, walk: 1.4},  // m/s at 1x
};
const LSK = 'amrNav.v1.';
const qs = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

/* ---------- storage (per-device convenience only) ---------- */
function lsGet(k, d) { try { const v = localStorage.getItem(LSK + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LSK + k, JSON.stringify(v)); } catch (e) { /* private mode, storage full */ } }
const asObj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};   // saved done and skipped must be plain objects

/* ---------- state ---------- */
const S = {
  route: null, base: null, legs: [], stopBy: {},
  routeText: '', routeSig: '', pending: null,   // route.json text in use, its hash, and a newer route that waits for the next new drive
  legIdx: 0, done: {}, skipped: {}, passed: {}, override: null,   // passed: stops the vehicle drove away from without a tap, to check later
  follow: true, voice: lsGet('voice', true), tiles: lsGet('tiles', false),
  started: false, fix: null, fixAt: 0, recent: [], leaveCnt: 0, blocked: false, lastHeading: null, offCnt: 0, offRoute: false, lastReroute: 0,   // fixAt: when the newest fix arrived (ms); recent: earlier good fixes a speed is measured from; leaveCnt: fixes in a row that show the vehicle leaving a waiting stop
  rt: null, lastAlong: 0, announced: {}, arrivedLeg: -1, waiting: null,   // lastAlong: distance along the leg at the last good match (m)
  sim: null, wake: null,
};
let rerouteSeq = 0;   // numbers reroute requests; setLeg() bumps it so a late reply for an old leg is dropped

/* ---------- geometry ---------- */
const R = 6371008.8, D2R = Math.PI / 180;
function hav(a, b) {
  const p1 = a[0] * D2R, p2 = b[0] * D2R, dp = p2 - p1, dl = (b[1] - a[1]) * D2R;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const p1 = a[0] * D2R, p2 = b[0] * D2R, dl = (b[1] - a[1]) * D2R;
  const y = Math.sin(dl) * Math.cos(p2), x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / D2R + 360) % 360;
}
function prepLeg(leg) {
  const lat0 = leg.geom[0][0], k = Math.cos(lat0 * D2R);
  const xy = leg.geom.map(p => [p[1] * D2R * R * k, p[0] * D2R * R]);
  const cum = [0];
  for (let i = 1; i < xy.length; i++) cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  const rt = {leg, lat0, k, xy, cum, total: cum[cum.length - 1]};
  let from = 0;
  rt.steps = leg.steps.map(s => {
    const pr = project(rt, s.loc, from, xy.length - 2);
    from = Math.max(0, pr.idx);
    return Object.assign({}, s, {along: pr.along});
  });
  for (let i = 1; i < rt.steps.length; i++) rt.steps[i].along = Math.max(rt.steps[i].along, rt.steps[i - 1].along);
  if (rt.steps.length) rt.steps[rt.steps.length - 1].along = Math.max(rt.steps[rt.steps.length - 1].along, rt.total);
  return rt;
}
function project(rt, p, i0, i1, ok) {          // ok(i), when given, says whether segment i may be used
  const q = [p[1] * D2R * R * rt.k, p[0] * D2R * R], n = rt.xy.length;
  if (n === 1) return {d: Math.hypot(q[0] - rt.xy[0][0], q[1] - rt.xy[0][1]), along: 0, idx: 0};
  let best = {d: Infinity, along: 0, idx: 0};
  const a0 = Math.max(0, i0 == null ? 0 : i0), a1 = Math.min(n - 2, i1 == null ? n - 2 : i1);
  for (let i = a0; i <= a1; i++) {
    if (ok && !ok(i)) continue;
    const A = rt.xy[i], B = rt.xy[i + 1], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
    let t = L2 ? ((q[0] - A[0]) * dx + (q[1] - A[1]) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(q[0] - (A[0] + t * dx), q[1] - (A[1] + t * dy));
    if (d < best.d) best = {d, along: rt.cum[i] + t * Math.sqrt(L2), idx: i};
  }
  return best;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);   // degrees between two bearings, 0 to 180
/* Match a position to the leg. A road driven twice (out, then back) must not make the guide jump to the other pass.
   S.lastAlong is the highest distance along the leg matched so far; it never moves back except when the whole leg is searched again.
   1. Look first at the part of the leg from 30 m behind that point to CFG.lookAhead m ahead of it.
   2. If nothing there is within the off-route distance (or only a point more than 30 m behind), search the whole leg.
   With a known heading (hd, degrees), a segment that runs against it by more than 90 degrees is the other lane and is not used;
   if that rules out every segment near the position, the heading is ignored. */
function locate(rt, p, hd) {
  const n = rt.cum.length, lo = S.lastAlong - 30, hi = S.lastAlong + CFG.lookAhead, limit = CFG.off[rt.leg.mode];
  const way = hd == null ? null : i => {
    const a = rt.xy[i], b = rt.xy[i + 1], dx = b[0] - a[0], dy = b[1] - a[1];
    return Math.hypot(dx, dy) < 0.5 || angDiff(Math.atan2(dx, dy) / D2R, hd) <= 90;
  };
  let i0 = 0, i1;
  while (i0 < n - 2 && rt.cum[i0 + 1] < lo) i0++;        // first segment that ends at or after lo
  i1 = i0;
  while (i1 < n - 2 && rt.cum[i1 + 1] <= hi) i1++;       // last segment that starts at or before hi
  let pr = project(rt, p, i0, i1, way);
  if (pr.d <= limit && pr.along >= lo - 0.01) { S.lastAlong = Math.max(S.lastAlong, pr.along); return pr; }
  pr = project(rt, p, null, null, way);
  if (pr.d > limit && way) pr = project(rt, p);
  if (pr.d <= limit) S.lastAlong = pr.along;             // a position off the route does not move the anchor
  return pr;
}

/* ---------- words and units (US) ---------- */
const DIRS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];
const compass = b => DIRS[Math.round((((b || 0) % 360) + 360) % 360 / 45) % 8];
const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 >> 3 ^ 1 && n % 10) || 0] || 'th');
function fmtDist(m) {
  const ft = m * 3.28084;
  if (ft < 1000) return Math.max(0, Math.round(ft / 10) * 10) + ' ft';
  const mi = m / 1609.344;
  return (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + ' mi';
}
function sayDist(m) {
  const ft = m * 3.28084;
  if (ft < 1000) return (Math.round(ft / 50) * 50 || 50) + ' feet';
  const mi = m / 1609.344;
  return (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + ' miles';
}
function fmtDur(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function instr(s, mode) {
  const nm = s.name || s.ref || '';
  const onto = nm ? ' onto ' + nm : '';
  const mod = (s.mod || '').trim();
  const side = mod.replace('slight ', '').replace('sharp ', '');
  if (mod === 'uturn') return 'Make a U-turn' + onto;
  switch (s.type) {
    case 'depart': return (mode === 'walk' ? 'Walk ' : 'Head ') + compass(s.ba) + (nm ? ' on ' + nm : '');
    case 'offpath': return mode === 'walk' ? 'Leave the path. Walk straight to the meter' : 'Continue straight';
    case 'turn': case 'end of road':
      if (mod === 'straight' || !mod) return 'Continue straight' + onto;
      return (s.type === 'end of road' ? 'At the end of the road, turn ' : 'Turn ') + mod + onto;
    case 'new name': return 'Continue' + (onto || ' straight');
    case 'continue': return (mod && mod !== 'straight' ? 'Keep ' + side : 'Continue') + (onto || (mod && mod !== 'straight' ? '' : ' straight'));
    case 'merge': return 'Merge' + (side && side !== 'straight' ? ' ' + side : '') + onto;
    case 'on ramp': return 'Take the ramp' + (side && side !== 'straight' ? ' on the ' + side : '') + onto;
    case 'off ramp': return 'Take the exit' + (side && side !== 'straight' ? ' on the ' + side : '') + onto;
    case 'fork': return 'Keep ' + (side || 'straight') + ' at the fork' + onto;
    case 'roundabout': case 'rotary': return s.exit ? 'At the roundabout, take the ' + ord(s.exit) + ' exit' + onto : 'Enter the roundabout' + onto;
    case 'roundabout turn': return 'At the roundabout, turn ' + (mod || 'straight') + onto;
    case 'exit roundabout': case 'exit rotary': return 'Exit the roundabout' + onto;
    default: return 'Continue' + (onto || ' straight');
  }
}
function arrowAngle(s) {
  const m = s.mod || '';
  if (s.type === 'depart' || s.type === 'offpath') return 0;
  return ({'straight': 0, 'slight right': 40, 'right': 90, 'sharp right': 135, 'slight left': -40, 'left': -90, 'sharp left': -135})[m] || 0;
}
function arrowSvg(s) {
  if (!s || s.type === 'arrive') return '<svg viewBox="0 0 48 48"><path fill="#fff" d="M24 4a14 14 0 0 0-14 14c0 10.5 14 26 14 26s14-15.5 14-26A14 14 0 0 0 24 4zm0 19a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>';
  if (s.mod === 'uturn') return '<svg viewBox="0 0 48 48"><path fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" d="M30 42V20a8 8 0 0 0-16 0v10"/><path fill="#fff" d="M6 28h16l-8 11z"/></svg>';

    geom.push(...g);

  try {
    const [rText, b] = await Promise.all([fetch('route.json', {cache: 'no-cache'}).then(x => x.text()), fetch('basemap.json').then(x => x.json()).catch(() => null)]);
    const fetched = parseRoute(rText);
    if (!fetched) throw new Error('route.json is missing or damaged');
    const fSig = fnv1a(rText), reset = qs.has('reset');
    if (reset) clearProgress();
    const savedLeg = Number(lsGet('leg', 0));
    const progress = (Number.isInteger(savedLeg) && savedLeg > 0) || Object.keys(asObj(lsGet('done', {}))).length > 0 || Object.keys(asObj(lsGet('skipped', {}))).length > 0;
    const pinText = lsGet('activeRoute', null), pinSig = lsGet('activeSig', '');
    // a drive has progress and a newer route arrived: keep driving the pinned route, offer the new one at the next new drive
    const pinned = progress && pinSig && pinSig !== fSig && typeof pinText === 'string' && fnv1a(pinText) === pinSig ? parseRoute(pinText) : null;
    if (pinned) {
      setRoute(pinned, pinText, pinSig);
      S.pending = {route: fetched, text: rText, sig: fSig};
    } else {
      setRoute(fetched, rText, fSig);
      S.pending = null;
      // progress saved for a different route, with no pinned copy to keep it on: start clean (old app versions saved built:legs)
      const was = lsGet('sig', '');
      if (was !== fSig && was !== fetched.built + ':' + fetched.legs.length) clearProgress();
      lsSet('sig', fSig);
    }
    S.base = b;
    if (qs.has('reset')) { qs.delete('reset'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
    const li = Number(lsGet('leg', 0));
    S.legIdx = Number.isInteger(li) ? Math.max(0, Math.min(li, S.legs.length - 1)) : 0;
    S.done = asObj(lsGet('done', {})); S.skipped = asObj(lsGet('skipped', {})); S.passed = asObj(lsGet('passed', {}));
    drawBase(); applyTiles();
    showRoute(); renderStart();
    if (qs.has('sim')) simStart(); else startGps();
  } catch (e) {
    $('startBody').innerHTML = '<p>The route did not load. Connect to the internet once, then reopen the app.</p>';
    console.error(e);
  }
}
load();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', updateOfflineLine);   // the first install takes control a moment after load
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ }); });
}
</script>
</body>
