<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://tile.openstreetmap.org; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMR Route Guide</title>
<meta name="description" content="GPS guide for the Sensus AMR water meter read route, WSU Pullman.">
<meta name="theme-color" content="#981e32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
:root{--primary:#981e32;--primary-dark:#7a1828;--accent:#c69214;--bg:#f5f5f5;--card:#fff;--text:#2d2d2d;
--muted:#6b7280;--border:#e5e7eb;--green:#059669;--blue:#2563eb;--warn-bg:#fff3cd;--warn-text:#7a5b00;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
 font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
#map{position:absolute;inset:0;background:#efe9e2}
.leaflet-container{background:#efe9e2}
/* maneuver banner */
#banner{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;max-width:560px;z-index:900;
 background:var(--primary);color:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;
 gap:12px;padding:10px 14px;min-height:76px}
#banner.walk{background:var(--blue)}
#banner.off{background:#b45309}
#banner.idle{background:#374151}
#bArrow{flex:0 0 56px;height:56px}
#bArrow svg{width:56px;height:56px}
#bText{flex:1;min-width:0}
#bDist{font-size:28px;font-weight:800;line-height:1.05}
#bInstr{font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
#bThen{font-size:13px;opacity:.9;margin-top:2px}
/* stop card */
#card{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:560px;z-index:900;
 background:var(--card);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);overflow:hidden}
#cardHead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.stopno{background:var(--primary);color:#fff;font-weight:800;border-radius:16px;min-width:34px;height:34px;padding:0 8px;
 display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.stopno.walk{background:var(--blue)}
.stopno.depot{background:#374151}
#cTitle{flex:1;min-width:0}
#cSite{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cSub{font-size:13px;color:var(--muted)}
#cToggle{background:none;border:none;font-size:20px;color:var(--muted);padding:4px 8px}
#meters{max-height:32vh;overflow:auto;padding:4px 12px;display:none}
#card.open #meters{display:block}
.m{padding:6px 0;border-bottom:1px solid #f0edea;font-size:14px}
.m:last-child{border-bottom:none}
.m .mn{font-family:Consolas,Menlo,monospace;font-weight:700}
.m .mw{color:var(--muted)}
.m.attn{background:var(--warn-bg);margin:0 -12px;padding:6px 12px}
.m .note{color:var(--warn-text);font-size:13px}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px}
#prompt{display:none;padding:10px 12px;background:#faf7f4;border-top:1px solid var(--border);font-size:15px}
#prompt.show{display:block}
#prompt b{display:block;margin-bottom:6px}
#actions{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:48px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);
 font-weight:700;font-size:15px;padding:8px 12px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--primary);border-color:var(--primary)}
.btn:disabled{opacity:.45}
/* side controls */
#side{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:900;display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);
 display:flex;align-items:center;justify-content:center;color:var(--text)}
.fab svg{width:26px;height:26px}
.fab.on{color:var(--primary)}
.fab.off{color:#9ca3af}
#gps{background:#fff;border-radius:14px;padding:4px 6px;font-size:11.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);
 text-align:center;width:52px;line-height:1.15}
.leaflet-bottom{bottom:var(--ctlBottom,0px)}
#gps.good{color:var(--green)} #gps.weak{color:#b45309} #gps.none{color:#dc2626}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:40%;z-index:1500;background:rgba(17,24,39,.92);color:#fff;
 padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;text-align:center;display:none}
/* list panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:1100;background:var(--card);
 box-shadow:-4px 0 18px rgba(0,0,0,.25);display:none;flex-direction:column}
#panel.show{display:flex}
#panel.over{z-index:1400}   /* opened from the start screen, which is above the normal panel level */
#pHead{background:var(--primary);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#pHead h2{margin:0;font-size:18px;flex:1}
#pHead button{background:none;border:none;color:#fff;font-size:26px;line-height:1}
#pBody{overflow:auto;flex:1;padding:8px 12px 24px}
.sum{font-size:14px;color:var(--muted);margin:6px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #f0edea;border-radius:8px}
.row.cur{background:#fdf2f4}
.row .stopno{min-width:30px;height:30px;font-size:14px}
.row .rs{flex:1;min-width:0}
.row .rs div:first-child{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs div:last-child{font-size:12.5px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap}
.chip.done{background:#d1fae5;color:#065f46} .chip.skip{background:#e5e7eb;color:#374151} .chip.attn{background:var(--accent);color:#fff}
.chip.pass{background:#fef3c7;color:#92400e}
.row button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;color:var(--primary)}
.sec{font-weight:800;color:var(--primary);margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.help p{margin:6px 0;font-size:14px}
.help li{font-size:14px;margin:4px 0}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* start screen */
#start{position:absolute;inset:0;z-index:1300;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#startCard{background:#fff;border-radius:14px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#startCard header{background:var(--primary);color:#fff;padding:16px 18px}
#startCard header h1{margin:0;font-size:22px}
#startCard header p{margin:4px 0 0;font-size:13.5px;opacity:.92}
#startCard .body{padding:14px 18px}
#startCard .body p{margin:6px 0;font-size:14.5px}
#startCard .body p.newroute{background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:8px 10px;font-weight:600}
#startCard .btns{display:flex;flex-direction:column;gap:10px;padding:0 18px 18px}
/* sim */
#sim{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));z-index:950;background:#111827;color:#fff;
 border-radius:10px;padding:6px 10px;display:none;gap:8px;align-items:center;font-size:13px}
#sim.show{display:flex}
#sim button{background:#374151;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-weight:700}
/* markers */
.sm{background:var(--primary);color:#fff;border:2px solid #fff;border-radius:14px;font-weight:800;font-size:12px;
 min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0 4px}
.sm.done{background:var(--green)} .sm.skip{background:#9ca3af} .sm.pass{background:#f59e0b;color:#fff} .sm.cur{background:var(--accent);transform:scale(1.25)}
.sm.attn{border-color:var(--accent)}
.sm.depot{background:#374151}
.me{width:30px;height:30px}
/* meter pins (zoom CFG.meterPinZoom or closer) and the map boxes (Leaflet popups) */
.mpw{width:36px;height:36px;display:flex;align-items:center;justify-content:center}   /* a 36 px tap area around the small pin */
.mp{position:relative;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mp::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--primary)}
.mp.attn{width:20px;height:20px;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--accent),0 1px 4px rgba(0,0,0,.45)}
.mp.attn::after{content:'!';left:0;right:0;top:0;bottom:0;width:auto;height:auto;margin:0;background:none;border-radius:0;color:#fff;
 font:800 13px/16px -apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.mp .mpn{position:absolute;top:-11px;left:11px;background:#374151;color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:0 4px;
 line-height:14px;border:1.5px solid #fff;white-space:nowrap}
.mp-pop .leaflet-popup-content-wrapper{padding:0;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.mp-pop .leaflet-popup-content{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.leaflet-container .mp-pop a.leaflet-popup-close-button{width:44px;height:44px;font:26px/44px -apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.pp-head{background:var(--primary);color:#fff;padding:10px 46px 10px 14px}
.pp-head b{display:block;font-size:17px;line-height:1.25}
.pp-head b.id{font-family:Consolas,Menlo,monospace}
.pp-head small{display:block;font-size:13px;opacity:.92;margin-top:2px}
.pp-head .badge{vertical-align:2px}
.pp-kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:12px 14px 2px;font-size:15px}
.pp-kv dt{color:var(--muted)}
.pp-kv dd{margin:0;font-weight:600}
.pp-kv dd.mono{font-family:Consolas,Menlo,monospace}
.pp-note{margin:10px 14px 0;background:var(--warn-bg);color:var(--warn-text);font-size:13.5px;border-radius:8px;padding:6px 10px}
.pp-foot{display:flex;gap:8px;padding:12px 14px 14px}
.pp-list{max-height:min(54vh,430px);overflow:auto}
.pp-m{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #f0edea}
.pp-m.attn{background:var(--warn-bg)}
.pp-m .rs{flex:1;min-width:0}
.pp-m .rs b{font-family:Consolas,Menlo,monospace;font-size:14.5px}
.pp-m .rs small{display:block;color:var(--muted);font-size:12.5px}
.pp-m .rs em{display:block;font-style:normal;color:var(--warn-text);font-size:12.5px}
.pp-m button{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:8px;min-height:44px;padding:6px 12px;font-weight:700;
 color:var(--primary);font-size:14.5px}
/* manual reads: overlay parts shared by the form, the list and the export sheet; then the form */
.mr-over{position:absolute;inset:0;z-index:1450;background:rgba(17,24,39,.55);display:flex;justify-content:center;align-items:flex-start;
 overflow:auto;padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
.mr-over[hidden]{display:none}
.mr-sheet{background:var(--card);border-radius:12px;width:100%;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:50vh}
.mr-head{background:var(--primary);color:#fff;padding:12px 14px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px}
.mr-head h2{margin:0;font-size:18px;flex:1}
.mr-head button{background:none;border:none;color:#fff;font-size:26px;line-height:1;min-width:44px;min-height:44px}
.mr-body{padding:10px 14px}
.mr-lab{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.mr-body input[type=text],.mr-body select,.mr-body textarea{width:100%;min-height:48px;font:inherit;font-size:18px;padding:8px 10px;
 border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
#mrRead,#mrMult{font-family:Consolas,Menlo,monospace;font-size:22px;letter-spacing:.04em}
#mrOther{margin-top:8px}
.mr-err{color:#b91c1c;font-size:14px;font-weight:600}
.mr-bad{border-color:#b91c1c !important;box-shadow:0 0 0 1px #b91c1c}
.mr-bad:focus{outline:2px solid #b91c1c;outline-offset:0}   /* a bad field stays red while it has focus */
#mrMeters{border:1px solid var(--border);border-radius:8px;overflow:hidden}   /* no height cap: every row shows in full, the sheet scrolls (shot 04) */
.mr-m{display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid #f0edea;font-size:14px;cursor:pointer}
.mr-m:last-child{border-bottom:none}
.mr-m.on{background:#fdf2f4}
.mr-m input{width:22px;height:22px;margin:2px 0 0;flex:0 0 22px}
.mr-m b{display:block;font-family:Consolas,Menlo,monospace}
.mr-m.mr-other b{font-family:inherit}   /* "Other meter" is a label, not a meter ID */
.mr-m small{display:block;color:var(--muted);font-size:13px}
.mr-m em{display:block;font-style:normal;color:var(--warn-text);font-size:13px}
.mr-note{font-size:13.5px;color:var(--muted);margin:8px 0}
.mr-foot{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px 14px;background:var(--card);border-top:1px solid var(--border);
 border-radius:0 0 12px 12px;flex-wrap:wrap}
.mr-photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
#mrThumb{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
#mrList{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:1100;background:var(--card);
 box-shadow:-4px 0 18px rgba(0,0,0,.25);display:flex;flex-direction:column}
#mrList[hidden]{display:none}
#mrList.over{z-index:1400}   /* opened from the start screen, which is above the normal panel level */
#mrList .mr-head{border-radius:0;padding-top:calc(12px + env(safe-area-inset-top))}
#mrListBody{overflow:auto;flex:1}
#mrList .mr-foot{position:static;border-radius:0}
.mr-row .rs div:first-child{font-family:Consolas,Menlo,monospace}
.mr-row .rs div+div{font-size:12.5px;color:var(--muted)}
.mr-row .rs .mr-file{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* ruling S4: the CSV name never breaks inside */
#mrStartBtns:empty{display:none}
#mrExport{z-index:1460}
.mr-part{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0}
.mr-part b{display:block}
.mr-part .pbtns{margin:8px 0 0}
/* the Manual reads list foot: a status line (app), New read, and the send button with its To line under it (app) */
.mr-sendst{flex:1 1 100%;margin:0;border-radius:8px;padding:9px 12px;font-size:14.5px;font-weight:700;line-height:1.3}
.mr-sendst[hidden],.mr-to[hidden]{display:none}
.mr-sendst.ok{background:#d1fae5;color:#065f46}
.mr-sendst.bad{background:#fee2e2;color:#991b1b}
#mrList #mrNew{flex:1 1 0;align-self:flex-start}
.mr-send{flex:2 1 0;display:flex;flex-direction:column;min-width:0}
.mr-send .btn{width:100%}
.mr-to{font-size:12.5px;color:var(--muted);text-align:center;margin-top:5px}
@media (max-width:899.98px){#mrList,#panel{width:100vw}}   /* ruling S5: portrait, the lists use the whole screen; landscape keeps a side panel */
@media (min-width:900px) and (orientation:landscape){
 #banner{right:auto;width:520px}
 #card{right:auto;width:520px}
}
@media (max-width:420px){
 #bDist{font-size:24px} #bInstr{font-size:17px} #bArrow,#bArrow svg{width:46px;height:46px;flex-basis:46px}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Route map"></div>

<div id="banner" class="idle" aria-live="polite">
 <div id="bArrow"></div>
 <div id="bText"><div id="bDist">&nbsp;</div><div id="bInstr">Loading the route</div><div id="bThen"></div></div>
</div>
<div id="side">
 <div id="gps" class="none">GPS off</div>
 <button class="fab on" id="fFollow" title="Follow my position" aria-label="Follow my position"></button>
 <button class="fab on" id="fVoice" title="Voice on or off" aria-label="Voice on or off"></button>
 <button class="fab" id="fLayer" title="Map style" aria-label="Map style"></button>
 <button class="fab" id="fList" title="Stop list" aria-label="Stop list"></button>
</div>

<div id="card">
 <div id="cardHead">
  <span class="stopno" id="cNo">1</span>
  <div id="cTitle"><div id="cSite">&nbsp;</div><div id="cSub">&nbsp;</div></div>
  <button id="cToggle" aria-label="Show meters">&#9650;</button>
 </div>
 <div id="meters"></div>
 <div id="prompt"></div>
 <div id="actions">
  <button class="btn primary" id="aNext">Next</button>
  <button class="btn" id="aSkip">Skip stop</button>
  <button class="btn" id="aManual" type="button" hidden>Manual read</button>
  <button class="btn ghost" id="aGmaps">Google Maps</button>
 </div>
</div>

<div id="sim"><span>Simulate</span><button id="sPlay">Play</button><button id="sSpeed">5x</button></div>
<div id="toast" role="status"></div>

<aside id="panel" aria-label="Stop list">
 <div id="pHead"><h2>Stops</h2><button id="pClose" aria-label="Close">&times;</button></div>
 <div id="pBody"></div>
</aside>

<div id="mrForm" class="mr-over" role="dialog" aria-modal="true" aria-labelledby="mrFormTitle" hidden>
 <div class="mr-sheet">
  <div class="mr-head"><h2 id="mrFormTitle">Manual read</h2></div>
  <div class="mr-body">
   <label class="mr-lab" for="mrStop">Stop</label>
   <select id="mrStop"></select>
   <div class="mr-lab" id="mrMeterLab">Meter</div>
   <div id="mrMeters" role="radiogroup" aria-labelledby="mrMeterLab"></div>
   <input id="mrOther" type="text" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Other meter ID" placeholder="Type the meter ID" hidden>
   <div class="mr-err" id="mrMetersErr" role="alert"></div>
   <label class="mr-lab" for="mrRead">Face read, as the dial shows</label>
   <input id="mrRead" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
   <div class="mr-err" id="mrReadErr" role="alert"></div>
   <label class="mr-lab" for="mrMult">Multiplier</label>
   <input id="mrMult" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
   <div class="mr-err" id="mrMultErr" role="alert"></div>
   <label class="mr-lab" for="mrNotes">Notes (optional)</label>
   <textarea id="mrNotes" rows="3" maxlength="500"></textarea>
   <div class="mr-photo"><img id="mrThumb" alt="Photo of the meter face" hidden><button class="btn" id="mrPhotoBtn" type="button">Photo</button><button class="btn" id="mrPhotoDel" type="button" hidden>Remove photo</button></div>
   <p class="mr-note" id="mrPhotoNote"></p>
   <input id="mrCam" type="file" accept="image/*" capture="environment" hidden>
   <p class="mr-note" id="mrGps"></p>
  </div>
  <div class="mr-foot"><button class="btn" id="mrCancel" type="button">Cancel</button><button class="btn primary" id="mrSave" type="button">Save</button></div>
 </div>
</div>

<aside id="mrList" aria-label="Manual reads" hidden>
 <div class="mr-head"><h2>Manual reads</h2><button id="mrListClose" type="button" aria-label="Close">&times;</button></div>
 <div id="mrListBody" class="mr-body"></div>
 <div class="mr-foot"><div class="mr-sendst" id="mrSendState" role="status" hidden></div><button class="btn" id="mrNew" type="button">New read</button><div class="mr-send"><button class="btn primary" id="mrExportBtn" type="button">Send</button><div class="mr-to" id="mrSendTo" hidden></div></div></div>
</aside>

<div id="mrExport" class="mr-over" role="dialog" aria-modal="true" aria-labelledby="mrExportTitle" hidden>
 <div class="mr-sheet">
  <div class="mr-head"><h2 id="mrExportTitle">Export manual reads</h2><button id="mrExportClose" type="button" aria-label="Close">&times;</button></div>
  <div id="mrExportBody" class="mr-body"></div>
 </div>
</div>

<div id="start">
 <div id="startCard">
  <header><h1>AMR Route Guide</h1><p>Sensus AMR water meter read route, WSU Pullman</p></header>
  <div class="body" id="startBody"><p>Loading the route&hellip;</p></div>

/* ---------- legs and stops ---------- */

/* The first leg after leg i that the guide should lead to: a stop whose parking or stop leg belongs to a stop that is already

/* ---------- arrival handling ---------- */
function arrived() {

        if (ring) for (let j = G.ao[v]; j < G.ao[v + 1]; j++) {
          const i = G.adj[j];
          if (!G.ra[i] && ((G.ea[i] === v && (G.fl[i] & F_FWD)) || (G.eb[i] === v && (G.fl[i] & F_BWD)))) ring.exit++;
        }
      } else {                                           // out of the ring
        if (ring) { ring.exit++; ring.name = nameOf(B.e); ring.outB = outB; ring = null; }

      }
      if (s) steps.push(Object.assign(s, {loc: geom[J.k], ba: Math.round(outB) % 360, along: d, inB, outB, ang: a, opts: [], rank: rankOf(B.e)}));

    }

    } else {
      const opts = [], opt = (i, b) => opts.push({a: turnOf(b - inB), rank: rankOf(i), name: nameOf(i)});
      if (A.e < 0) {                                   // from the position onto the road: its other direction, when that is open

  const out = [];
  const fixed = x => x.type === 'depart' || x.type === 'offpath' || x.atStart || x.fixed;

      // a maneuver just before the arrival, or just before the walker leaves the path, is not said
      while (!fixed(out[out.length - 1]) && s.along - out[out.length - 1].along < CFG.mergeM) out.pop();
      out.push(s);

    }
    if (fixed(z) || fixed(s)) { out.push(s); return; }

    if (s.type === 'new name' && s.along - z.along < CFG.nameM) { z.name = s.name; return; }
    if (s.along - z.along >= CFG.mergeM) { out.push(s); return; }

    if (z.ang * s.ang < 0 && Math.abs(z.ang) >= 45 && Math.abs(s.ang) >= 45) { out.push(s); return; }

    steps: out.map((s, j) => {

}
/* A new leg from `from` ([lat, lon]) to the end of leg `base`, planned on this device. hd: the vehicle's heading (degrees) or null.

function planLeg(from, base, hd) {
  if (!GR) return {fail: graphErr ? 'The road map did not load. Follow the arrow.' : 'Loading the road map. Follow the arrow.'};

}
/* Off route: plan a new leg to the end of the current leg, on this device, with no network. force: the vehicle just left the route,

   (applyReroute then ran the newest fix again on it). While graph.json still loads, the plan waits for it; a plan that is no

  if (!GR && !graphLoading && graphErr && Date.now() - graphTriedAt >= CFG.graphRetryMs) startGraphLoad();
  if (GR || !graphLoading) return applyReroute(seq, legAt, from, hd);

function applyReroute(seq, legAt, from, hd) {

  const base = S.legs[legAt];
  let p, rt = null;

    p = planLeg(from, base, hd);

  S.override = p.leg; S.rt = rt; S.lastAlong = 0; S.announced = {}; S.offCnt = 0; S.offRoute = false; S.rerouteNote = '';

  toast('New route to ' + (stopOf(base) ? 'stop ' + stopOf(base).o : 'the finish'));

}

function simStart() {
  S.sim = {on: false, speed: 5, legIdx: -1, dist: 0, timer: null};
  $('sim').classList.add('show');
  $('sPlay').onclick = () => { S.sim.on = !S.sim.on; $('sPlay').textContent = S.sim.on ? 'Pause' : 'Play'; };
  $('sSpeed').onclick = () => { S.sim.speed = S.sim.speed === 1 ? 5 : S.sim.speed === 5 ? 20 : 1; $('sSpeed').textContent = S.sim.speed + 'x'; };
  S.sim.timer = setInterval(simTick, 1000);
}
function simTick() {
  if (!S.sim.on || !S.started || S.waiting) return;
  const leg = currentLeg();
  if (S.sim.legRef !== leg) { S.sim.legRef = leg; S.sim.dist = 0; S.sim.rt = prepLeg(leg); }
  const rt = S.sim.rt;
  S.sim.dist = Math.min(rt.total, S.sim.dist + CFG.simSpeed[leg.mode] * S.sim.speed);
  let i = 0;
  while (i < rt.cum.length - 2 && rt.cum[i + 1] < S.sim.dist) i++;
  const seg = rt.cum[i + 1] - rt.cum[i] || 1, t = Math.min(1, (S.sim.dist - rt.cum[i]) / seg);
  const a = leg.geom[i], b = leg.geom[Math.min(i + 1, leg.geom.length - 1)];
  onFix({lat: a[0] + (b[0] - a[0]) * t, lon: a[1] + (b[1] - a[1]) * t, acc: 5, heading: bearing(a, b), speed: 10, t: Date.now()});
}

/* ---------- start ---------- */
/* Keep the screen on while guiding, with one lock at a time: no request while a lock is held (not released) or being asked for.
   The system can drop the lock (battery saver); then ask again while the app is in front, but at most once per CFG.wakeRetryMs,

}
let loaded = false;                   // load() has finished: the route is on screen

/* "Offline ready." once a service worker controls this page, its cache holds the route, the offline map and the road map for

  const offMap = () => { const miss = stopsOffMap();
    return miss ? 'The road map does not reach ' + miss + (miss === 1 ? ' stop: no new route to it.' : ' stops: no new route to them.') : ''; };

  voiceOff: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  layer: '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="currentColor"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="3.5" cy="6" r="1.6" fill="currentColor"/><circle cx="3.5" cy="12" r="1.6" fill="currentColor"/><circle cx="3.5" cy="18" r="1.6" fill="currentColor"/></svg>',
};
$('fFollow').innerHTML = ICON.follow; $('fLayer').innerHTML = ICON.layer; $('fList').innerHTML = ICON.list;
function paintVoice() { $('fVoice').innerHTML = S.voice ? ICON.voiceOn : ICON.voiceOff; $('fVoice').className = 'fab ' + (S.voice ? 'on' : 'off'); }
paintVoice();
$('fVoice').onclick = () => {
  S.voice = !S.voice; lsSet('voice', S.voice); paintVoice();
  if (!S.voice) { if (NATIVE) nativeCall('stopSpeech'); else if ('speechSynthesis' in window) speechSynthesis.cancel(); }
};
$('fFollow').onclick = () => { S.follow = true; $('fFollow').className = 'fab on'; if (S.fix) followTo([S.fix.lat, S.fix.lon], CFG.zoom[currentLeg() ? currentLeg().mode : 'drive']); };
$('fLayer').onclick = () => {
  const showing = streetShown();                        // what is on screen now, not only the saved choice
  if (!showing && !navigator.onLine) { toast('Street map needs a data connection'); return; }
  setTiles(!showing);
};
$('fList').onclick = openPanel;
$('pClose').onclick = closePanel;
$('cToggle').onclick = () => { const c = $('card'); c.classList.toggle('open'); $('cToggle').innerHTML = c.classList.contains('open') ? '&#9660;' : '&#9650;'; layoutVars(); };
map.on('dragstart', () => { S.follow = false; $('fFollow').className = 'fab off'; });

/* ---------- route signature and pinning ---------- */
function fnv1a(text) {                 // 32-bit FNV-1a hash of the text, as 8 hex digits
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}
function parseRoute(text) {            // the route object, or null when the text is missing or damaged
  try {
    const r = JSON.parse(text);
    return r && Array.isArray(r.legs) && r.legs.length && Array.isArray(r.stops) ? r : null;
  } catch (e) { return null; }
}
function setRoute(r, text, sig) {
  S.route = r; S.routeText = text; S.routeSig = sig; S.legs = r.legs; S.stopBy = {};
  r.stops.forEach(s => { S.stopBy[s.o] = s; });
}
function clearProgress() { lsSet('leg', 0); lsSet('done', {}); lsSet('skipped', {}); lsSet('passed', {}); lsSet('finished', false); }
/* Remember the route in use. A later deploy then cannot swap the route under a drive that has progress. */
function pinRoute() { lsSet('activeRoute', S.routeText); lsSet('activeSig', S.routeSig); lsSet('sig', S.routeSig); }
function showRoute() {                 // draw the route in S on the map and the cards
  S.rt = prepLeg(S.legs[S.legIdx]);
  drawRoute(); drawStops();
  map.fitBounds(L.latLngBounds(S.route.stops.map(s => [s.lat, s.lon])).pad(0.05), {animate: false});
  renderCard(); renderBanner();
}
/* The one way to start a new drive: stop 1 next, nothing reached, skipped or passed, not finished, saved at once. With adopt,
   a newer route that waits (S.pending) becomes the route in use first, and is pinned. The caller then moves to leg 0 with
   setLeg (directly, or through begin). Returns true when the newer route was loaded. */
function newDrive({adopt} = {}) {
  const swap = !!(adopt && S.pending);
  if (swap) {
    const p = S.pending;
    S.pending = null;
    setRoute(p.route, p.text, p.sig);
    pinRoute();
  }
  S.done = {}; S.skipped = {}; S.passed = {}; S.finished = false; S.legIdx = 0; S.override = null;
  clearProgress(); nativeDrive();
  if (swap) showRoute();
  return swap;
}

/* ---------- load ---------- */
async function cachedRouteText() {     // route.json as the service worker saved it last ('' when there is none)
  try {
    const r = 'caches' in window ? await caches.match('route.json') : null;
    return r ? await r.text() : '';
  } catch (e) { return ''; }
}
async function load() {
  try {
    const [netText, b] = await Promise.all([fetch('route.json', {cache: 'no-cache'}).then(x => x.text()).catch(() => ''), fetch('basemap.json').then(x => x.json()).catch(() => null)]);
    const reset = qs.has('reset');
    if (reset) clearProgress();
    const savedLeg = Number(lsGet('leg', 0));
    const progress = (Number.isInteger(savedLeg) && savedLeg > 0) || ['done', 'skipped', 'passed'].some(k => Object.keys(asObj(lsGet(k, {}))).length > 0);
    const pinText = lsGet('activeRoute', null), pinSig = lsGet('activeSig', '');
    const pin = pinSig && typeof pinText === 'string' && fnv1a(pinText) === pinSig ? parseRoute(pinText) : null;   // the route the drive started on, stored intact
    // a reply that is missing or damaged: run on the pinned route; with no pin, on the copy the service worker saved last
    let rText = netText, fetched = parseRoute(rText);
    if (!fetched && !pin) { rText = await cachedRouteText(); fetched = parseRoute(rText); }
    if (!fetched && !pin) throw new Error('route.json is missing or damaged');
    if (!fetched) {
      setRoute(pin, pinText, pinSig);
      S.pending = null;
    } else {
      const fSig = fnv1a(rText);
      if (progress && pin && pinSig !== fSig) {
        // a drive has progress and a newer route arrived: keep driving the pinned route, offer the new one at the next new drive
        setRoute(pin, pinText, pinSig);
        S.pending = {route: fetched, text: rText, sig: fSig};
      } else {
        setRoute(fetched, rText, fSig);
        S.pending = null;
        // progress saved for a different route, with no pinned copy to keep it on: start clean (old app versions saved built:legs)
        const was = lsGet('sig', '');
        if (was !== fSig && was !== fetched.built + ':' + fetched.legs.length) clearProgress();
        lsSet('sig', fSig);
      }
    }
    S.base = b;
    if (qs.has('reset')) { qs.delete('reset'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
    const li = Number(lsGet('leg', 0));
    S.legIdx = Number.isInteger(li) ? Math.max(0, Math.min(li, S.legs.length - 1)) : 0;
    S.done = asObj(lsGet('done', {})); S.skipped = asObj(lsGet('skipped', {})); S.passed = asObj(lsGet('passed', {}));
    S.finished = lsGet('finished', false) === true;
    drawBase(); applyTiles();
    showRoute(); renderStart();
    if (SIM) simStart(); else startGps();
    loaded = true;
    if (NATIVE) { nativeCall('ready', APP_VERSION); nativeDrive(); }   // this web copy works: the app keeps it
    if (MR_ON) mrAfterLoad(true);
  } catch (e) {
    $('startBody').innerHTML = '<p>The route did not load. Connect to the internet once, then reopen the app.</p>';
    console.error(e);
    if (MR_ON) mrAfterLoad(false);   // stored manual reads stay listable and exportable
  }
}
load();
if (MR_ON) mrInit();
startGraphLoad();                     // the road map for rerouting loads beside the route; the route never waits for it
if (!NATIVE && 'serviceWorker' in navigator) {    // the app keeps its own files and runs no service worker
  navigator.serviceWorker.addEventListener('controllerchange', updateOfflineLine);   // the first install takes control a moment after load
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ }); });
}
</script>
